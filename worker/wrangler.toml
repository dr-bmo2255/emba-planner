name = "emba-planner"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Cloudflare account that owns y-emba.org (the Worker must live in the same account as its domain).
account_id = "d2b58cfd9ad23b4a061d86bdfff2884b"

# Serve the planner at https://y-emba.org (Cloudflare creates the DNS record and certificate).
routes = [
  { pattern = "y-emba.org", custom_domain = true }
]

# The site itself (public/) is served by this Worker, so pages and API share one origin.
[assets]
directory = "../public"
binding = "ASSETS"
not_found_handling = "404-page"

[vars]
# Chat: Haiku 5.5 is plenty for looking things up in the planner ($0.10 / $0.50 per million tokens).
# Alternatives: "claude-sonnet-5-5" ($2 / $10) or "claude-opus-5-5" ($4 / $20). CHAT_ENABLED = "0" turns the chat off.
CHAT_MODEL = "claude-haiku-5-5"
CHAT_MAX_TOKENS = "4096"
CHAT_ENABLED = "1"
# Syllabus reading (admins only, a few times a term) stays on Opus: accuracy matters more than cost there.
EXTRACT_MODEL = "claude-opus-5-5"
# ADMIN_EMAILS (owner accounts, always admin; owners can add more admins in Manage courses) is a secret, so the address stays out of this public repo:
#   npx wrangler secret put ADMIN_EMAILS
# "log" prints sign-in codes to the console (local dev); "resend" emails them (production).
EMAIL_MODE = "resend"
EMAIL_FROM = "EMBA Planner <login@y-emba.org>"

[[d1_databases]]
binding = "DB"
database_name = "emba-planner"
# Production database (local dev uses a separate local copy).
database_id = "0ec02fbf-7017-4b13-8136-2a2d0a5ac24b"
migrations_dir = "migrations"

# Files sent from the iPhone share sheet ("Add to EMBA Planner" shortcut), kept 7 days.
[[kv_namespaces]]
binding = "INBOX"
id = "997f05b5a6fe43cab3fcb2f5d2364e6d"
