<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EMBA Planner</title>
  <meta name="description" content="Combined assignments, readings, and class schedule for the Yale SOM EMBA Class of 2028.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=2026-10-25d">
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-yale">Yale</span>
        <span class="brand-som">School of Management</span>
      </div>
      <div class="brand-sub">
        <span class="brand-program">MBA for Executives</span>
        <span class="brand-cohort">Class of 2028 · Course Planner</span>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="summary" id="summary" aria-live="polite"></section>

    <section class="toolbar">
      <div class="views" role="tablist" aria-label="View">
        <button role="tab" data-view="list">List</button>
        <button role="tab" data-view="calendar">Calendar</button>
        <button role="tab" data-view="course">By course</button>
      </div>
      <input type="search" id="search" placeholder="Search titles, cases, speakers…" aria-label="Search">
      <div class="toolbar-actions">
        <button class="btn" id="showAll">Show all</button>
        <button class="btn btn-ghost" id="clearAll">Clear output</button>
        <button class="btn btn-ghost" id="exportIcs" title="Download the items currently shown as a calendar file (.ics)">Export .ics</button>
      </div>
    </section>

    <section class="filters" id="filters"></section>

    <section id="view" class="view"></section>
  </main>

  <footer class="foot">
    Unofficial, student-built planner. Not affiliated with or endorsed by Yale SOM. Dates are subject to change, so always confirm on Canvas.
    Completed checkmarks are saved only in this browser.
    <span id="updated"></span>
  </footer>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-x" data-close aria-label="Close">×</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <!-- DATA: program + master schedule first, then one file per course. /add-syllabus adds lines here. -->
  <script src="data/program.js?v=2026-10-25d"></script>
  <script src="data/sessions.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT407.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT409.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT410.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT411.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT422.js?v=2026-10-25d"></script>
  <script src="data/courses/MGT699.js?v=2026-10-25d"></script>
  <!-- /DATA -->
  <script src="assets/app.js?v=2026-10-25d"></script>
  <script type="module" src="assets/assistant.js?v=2026-10-25d"></script>
</body>
</html>
